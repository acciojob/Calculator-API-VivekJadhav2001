    <!DOCTYPE html>
    <html>

    <head>
        <title>Calculator API</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="container">
            <h1>Calculator API</h1>
            <p>Hello world!</p>

            <div class="calculator">
                <input type="number" id="num1" placeholder="Enter first number">

                <input type="number" id="num2" placeholder="Enter second number">

                <div class="buttons">
                    <button onclick="add()">Add</button>
                    <button onclick="sub()">Subtract</button>
                    <button onclick="multiply()">Multiply</button>
                    <button onclick="divide()">Divide</button>
                </div>

                <pre id="result"></pre>
            </div>
        </div>

        <script>
            const LIMIT = 1000000;

            function getNumbers() {
                const num1 = document.getElementById("num1").value;
                const num2 = document.getElementById("num2").value;

                if (num1 === "" || num2 === "") {
                    return {
                        error: true,
                        response: {
                            status: "error",
                            message: "Invalid data types"
                        }
                    };
                }

                const n1 = Number(num1);
                const n2 = Number(num2);

                if (!Number.isFinite(n1) || !Number.isFinite(n2)) {
                    return {
                        error: true,
                        response: {
                            status: "error",
                            message: "Invalid data types"
                        }
                    };
                }

                if (n1 < -LIMIT || n2 < -LIMIT) {
                    return {
                        error: true,
                        response: {
                            status: "error",
                            message: "Underflow"
                        }
                    };
                }

                if (n1 > LIMIT || n2 > LIMIT) {
                    return {
                        error: true,
                        response: {
                            status: "error",
                            message: "Overflow"
                        }
                    };
                }

                return {
                    error: false,
                    num1: n1,
                    num2: n2
                };
            }

            function showResult(response) {
                document.getElementById("result").textContent =
                    JSON.stringify(response, null, 2);
            }

            function add() {
                const data = getNumbers();

                if (data.error) {
                    showResult(data.response);
                    return;
                }

                const result = data.num1 + data.num2;

                if (result < -LIMIT) {
                    showResult({
                        status: "error",
                        message: "Underflow"
                    });
                    return;
                }

                if (result > LIMIT) {
                    showResult({
                        status: "error",
                        message: "Overflow"
                    });
                    return;
                }

                showResult({
                    status: "success",
                    message: "the sum of given two numbers",
                    sum: result
                });
            }

            function sub() {
                const data = getNumbers();

                if (data.error) {
                    showResult(data.response);
                    return;
                }

                const result = data.num1 - data.num2;

                if (result < -LIMIT) {
                    showResult({
                        status: "error",
                        message: "Underflow"
                    });
                    return;
                }

                if (result > LIMIT) {
                    showResult({
                        status: "error",
                        message: "Overflow"
                    });
                    return;
                }

                showResult({
                    status: "success",
                    message: "the difference of given two numbers",
                    difference: result
                });
            }

            function multiply() {
                const data = getNumbers();

                if (data.error) {
                    showResult(data.response);
                    return;
                }

                const result = data.num1 * data.num2;

                if (result < -LIMIT) {
                    showResult({
                        status: "error",
                        message: "Underflow"
                    });
                    return;
                }

                if (result > LIMIT) {
                    showResult({
                        status: "error",
                        message: "Overflow"
                    });
                    return;
                }

                showResult({
                    status: "success",
                    message: "The product of given numbers",
                    result: result
                });
            }

            function divide() {
                const data = getNumbers();

                if (data.error) {
                    showResult(data.response);
                    return;
                }

                if (data.num2 === 0) {
                    showResult({
                        status: "error",
                        message: "Cannot divide by zero"
                    });
                    return;
                }

                const result = data.num1 / data.num2;

                if (result < -LIMIT) {
                    showResult({
                        status: "error",
                        message: "Underflow"
                    });
                    return;
                }

                if (result > LIMIT) {
                    showResult({
                        status: "error",
                        message: "Overflow"
                    });
                    return;
                }

                showResult({
                    status: "success",
                    message: "The division of given numbers",
                    result: result
                });
            }
        </script>

    </body>

    </html>
